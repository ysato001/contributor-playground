<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おしゃべりアシスタント</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      background: #f0f4f8;
      color: #1a1a2e;
      min-height: 100vh;
      font-size: 20px;
    }

    #setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      gap: 24px;
    }

    #setup-screen h1 {
      font-size: 2.4rem;
      color: #2c3e6e;
      text-align: center;
    }

    #setup-screen p {
      font-size: 1.2rem;
      color: #555;
      text-align: center;
      max-width: 500px;
    }

    #api-key-input {
      width: 100%;
      max-width: 500px;
      padding: 16px 20px;
      font-size: 1.2rem;
      border: 3px solid #aab8d0;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    #api-key-input:focus { border-color: #3a6ea5; }

    .btn-primary {
      background: #3a6ea5;
      color: white;
      border: none;
      border-radius: 16px;
      padding: 20px 48px;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      min-width: 200px;
    }

    .btn-primary:hover { background: #2c5282; }
    .btn-primary:active { transform: scale(0.97); }

    #app-screen { display: none; flex-direction: column; min-height: 100vh; }

    header {
      background: #2c3e6e;
      color: white;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1.8rem; }

    #mode-tabs {
      display: flex;
      gap: 0;
      background: #e8eef6;
      padding: 12px 20px;
      gap: 12px;
      border-bottom: 3px solid #c0cfe0;
    }

    .mode-tab {
      flex: 1;
      padding: 18px 12px;
      font-size: 1.3rem;
      font-weight: bold;
      border: 3px solid #aab8d0;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .mode-tab:hover { background: #d0e0f0; }

    .mode-tab.active {
      background: #3a6ea5;
      color: white;
      border-color: #2c5282;
    }

    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    #chat-area {
      flex: 1;
      background: white;
      border-radius: 16px;
      padding: 20px;
      overflow-y: auto;
      min-height: 300px;
      max-height: 420px;
      border: 2px solid #c0cfe0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .message.user { flex-direction: row-reverse; }

    .message-bubble {
      max-width: 72%;
      padding: 16px 20px;
      border-radius: 18px;
      font-size: 1.2rem;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.user .message-bubble {
      background: #3a6ea5;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .message-bubble {
      background: #f0f4f8;
      color: #1a1a2e;
      border: 2px solid #c0cfe0;
      border-bottom-left-radius: 4px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .avatar.user-av { background: #3a6ea5; }
    .avatar.ai-av { background: #e8eef6; border: 2px solid #c0cfe0; }

    #shiritori-status {
      display: none;
      background: #fff8e1;
      border: 2px solid #ffc107;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1.1rem;
    }

    #shiritori-status span { font-weight: bold; color: #d17a00; }

    #mic-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
    }

    #mic-btn {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      background: #3a6ea5;
      color: white;
      font-size: 2.6rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(58,110,165,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #mic-btn:hover { background: #2c5282; transform: scale(1.05); }
    #mic-btn.recording { background: #e53935; animation: pulse 1s infinite; }
    #mic-btn:disabled { background: #aaa; cursor: not-allowed; box-shadow: none; transform: none; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 16px rgba(229,57,53,0.4); }
      50% { transform: scale(1.08); box-shadow: 0 4px 24px rgba(229,57,53,0.7); }
    }

    #status-text {
      font-size: 1.2rem;
      color: #555;
      min-height: 30px;
      text-align: center;
    }

    #interim-text {
      font-size: 1.1rem;
      color: #3a6ea5;
      min-height: 28px;
      text-align: center;
      font-style: italic;
    }

    #stop-btn {
      display: none;
      background: #e53935;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }

    #stop-btn:hover { background: #b71c1c; }

    .error-msg {
      background: #ffebee;
      border: 2px solid #ef9a9a;
      border-radius: 12px;
      padding: 12px 20px;
      color: #c62828;
      font-size: 1.1rem;
      text-align: center;
    }

    #volume-control {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1rem;
      color: #555;
    }

    #volume-control input { width: 120px; }

    .thinking-dots {
      display: inline-block;
    }
    .thinking-dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }
  </style>
</head>
<body>

<!-- セットアップ画面 -->
<div id="setup-screen">
  <h1>🎙️ おしゃべりアシスタント</h1>
  <p>ご利用には Claude API キーが必要です。<br>キーはこの端末のメモリ内にのみ保存されます。</p>
  <input type="password" id="api-key-input" placeholder="Claude API キーを入力してください (sk-ant-...)" autocomplete="off">
  <div id="setup-error" class="error-msg" style="display:none;"></div>
  <button class="btn-primary" onclick="startApp()">はじめる</button>
</div>

<!-- アプリ本体 -->
<div id="app-screen">
  <header>
    <h1>🎙️ おしゃべりアシスタント</h1>
    <div id="volume-control">
      🔊
      <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1" title="音量">
    </div>
  </header>

  <div id="mode-tabs">
    <button class="mode-tab active" data-mode="chat" onclick="setMode('chat')">💬 自由会話</button>
    <button class="mode-tab" data-mode="search" onclick="setMode('search')">🔍 調べもの</button>
    <button class="mode-tab" data-mode="shiritori" onclick="setMode('shiritori')">🎮 しりとり</button>
  </div>

  <div id="main-content">
    <div id="shiritori-status">
      しりとり中 — 前の言葉の最後の文字：<span id="last-char">―</span>
      ｜使った言葉：<span id="used-count">0</span>語
    </div>

    <div id="chat-area"></div>

    <div id="mic-area">
      <div id="status-text">マイクボタンを押して話しかけてください</div>
      <div id="interim-text"></div>
      <button id="mic-btn" onclick="toggleMic()" title="マイク">🎤</button>
      <button id="stop-btn" onclick="stopSpeaking()">⏹ 読み上げを止める</button>
    </div>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let apiKey = '';
let mode = 'chat';
let conversation = [];
let isRecording = false;
let isSpeaking = false;
let recognition = null;
let currentUtterance = null;
let shiritori = { lastChar: '', usedWords: new Set(), active: false };

// ─── Setup ───────────────────────────────────────────────────────────────────
function startApp() {
  const key = document.getElementById('api-key-input').value.trim();
  if (!key.startsWith('sk-ant-')) {
    document.getElementById('setup-error').style.display = 'block';
    document.getElementById('setup-error').textContent = 'APIキーは sk-ant- で始まる形式です。ご確認ください。';
    return;
  }
  apiKey = key;
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'flex';
  greetUser();
}

// ─── Mode ─────────────────────────────────────────────────────────────────────
function setMode(newMode) {
  mode = newMode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === newMode));
  conversation = [];

  const shirStatus = document.getElementById('shiritori-status');
  if (newMode === 'shiritori') {
    shiritori = { lastChar: '', usedWords: new Set(), active: true };
    shirStatus.style.display = 'block';
    updateShiritoriStatus();
    clearChat();
    greetShiritori();
  } else {
    shiritori.active = false;
    shirStatus.style.display = 'none';
    clearChat();
    greetUser();
  }
}

function greetUser() {
  const greetings = {
    chat: 'こんにちは！何でもお話しください。お天気や趣味、思い出話など、なんでも大丈夫ですよ。',
    search: 'こんにちは！知りたいことや調べたいことを話しかけてください。できる限りお答えします。',
  };
  if (mode in greetings) {
    addMessage('assistant', greetings[mode]);
    speak(greetings[mode]);
  }
}

function greetShiritori() {
  const msg = 'しりとりをはじめましょう！私が先に言いますね。「りんご」。次は「ご」から始まる言葉を言ってください。';
  addMessage('assistant', msg);
  shiritori.lastChar = 'ご';
  shiritori.usedWords.add('りんご');
  updateShiritoriStatus();
  speak(msg);
}

// ─── Speech Recognition ───────────────────────────────────────────────────────
function toggleMic() {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
}

function startRecording() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showStatus('このブラウザは音声認識に対応していません。Chrome をお使いください。', true);
    return;
  }

  if (isSpeaking) stopSpeaking();

  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('mic-btn').textContent = '⏹';
    showStatus('聞いています…');
  };

  recognition.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    document.getElementById('interim-text').textContent = interim;
    if (final) handleUserInput(final);
  };

  recognition.onerror = (e) => {
    showStatus('音声認識エラー: ' + e.error, true);
    stopRecording();
  };

  recognition.onend = () => {
    stopRecording();
  };

  recognition.start();
}

function stopRecording() {
  isRecording = false;
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('mic-btn').textContent = '🎤';
  document.getElementById('interim-text').textContent = '';
  if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
  showStatus('マイクボタンを押して話しかけてください');
}

// ─── User Input Handler ───────────────────────────────────────────────────────
async function handleUserInput(text) {
  text = text.trim();
  if (!text) return;
  stopRecording();
  addMessage('user', text);
  showStatus('考えています…');
  document.getElementById('mic-btn').disabled = true;

  try {
    if (mode === 'shiritori') {
      await handleShiritori(text);
    } else {
      await callClaude(text);
    }
  } catch(e) {
    showStatus('エラーが発生しました: ' + e.message, true);
  }
  document.getElementById('mic-btn').disabled = false;
  showStatus('マイクボタンを押して話しかけてください');
}

// ─── Claude API ───────────────────────────────────────────────────────────────
const SYSTEM_PROMPTS = {
  chat: `あなたは高齢者向けの優しいおしゃべり相手です。話し相手として、温かく、ゆっくりとした日本語で会話してください。
- 短く分かりやすい言葉を使ってください
- 相手の話をよく聞いて、共感してください
- 励ましや褒め言葉を適度に入れてください
- 質問は一度に一つだけにしてください
- 200字以内で答えてください`,

  search: `あなたは高齢者向けの丁寧な案内係です。質問に対して分かりやすく、簡潔に日本語で答えてください。
- 難しい言葉は使わず、分かりやすく説明してください
- 箇条書きより、普通の文章で話すように答えてください
- 300字以内でまとめてください`,
};

async function callClaude(userText) {
  conversation.push({ role: 'user', content: userText });

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-opus-4-8',
      max_tokens: 512,
      system: SYSTEM_PROMPTS[mode] || SYSTEM_PROMPTS.chat,
      messages: conversation.slice(-10),
    }),
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `APIエラー (${res.status})`);
  }

  const data = await res.json();
  const reply = data.content[0].text;
  conversation.push({ role: 'assistant', content: reply });
  addMessage('assistant', reply);
  speak(reply);
}

// ─── Shiritori Logic ──────────────────────────────────────────────────────────
function toHiragana(str) {
  return str.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}

function getFirstChar(word) {
  return toHiragana(word.replace(/[ぁぃぅぇぉっゃゅょァィゥェォッャュョ]/g, c => {
    const map = {'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','っ':'つ','ゃ':'や','ゅ':'ゆ','ょ':'よ',
                 'ァ':'あ','ィ':'い','ゥ':'う','ェ':'え','ォ':'お','ッ':'つ','ャ':'や','ュ':'ゆ','ョ':'よ'};
    return map[c] || c;
  }))[0];
}

function getLastChar(word) {
  const h = toHiragana(word);
  // normalize small kana at end
  const last = h[h.length - 1];
  const map = {'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','っ':'つ','ゃ':'や','ゅ':'ゆ','ょ':'よ'};
  return map[last] || last;
}

async function handleShiritori(userWord) {
  const hWord = toHiragana(userWord);
  const firstChar = getFirstChar(hWord);

  // check starts with correct char
  if (shiritori.lastChar && firstChar !== shiritori.lastChar) {
    const msg = `「${shiritori.lastChar}」から始まる言葉を言ってください。もう一度どうぞ！`;
    addMessage('assistant', msg);
    speak(msg);
    return;
  }

  // check duplicate
  if (shiritori.usedWords.has(hWord)) {
    const msg = `「${userWord}」はもう使いましたよ。別の言葉を言ってください！`;
    addMessage('assistant', msg);
    speak(msg);
    return;
  }

  const lastChar = getLastChar(hWord);

  // check ん
  if (lastChar === 'ん') {
    const msg = `「${userWord}」は「ん」で終わるので負けです！またやりましょう。`;
    addMessage('assistant', msg);
    shiritori = { lastChar: '', usedWords: new Set(), active: false };
    updateShiritoriStatus();
    speak(msg);
    setTimeout(() => {
      shiritori = { lastChar: '', usedWords: new Set(), active: true };
      greetShiritori();
    }, 4000);
    return;
  }

  shiritori.usedWords.add(hWord);
  shiritori.lastChar = lastChar;
  updateShiritoriStatus();

  // Ask Claude for a word starting with lastChar
  const prompt = `しりとりゲームで「${userWord}」が来ました。「${lastChar}」から始まる日本語の一般的な言葉（名詞）を一つだけ答えてください。
条件：
- 「ん」で終わらない言葉
- まだ使っていない言葉（使用済み：${[...shiritori.usedWords].join('、')}）
- ひらがなまたはカタカナで一語だけ回答し、余計な説明は不要
返答形式：言葉のみ（例：「りんご」）`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-opus-4-8',
      max_tokens: 32,
      messages: [{ role: 'user', content: prompt }],
    }),
  });

  if (!res.ok) throw new Error('APIエラー');

  const data = await res.json();
  let aiWord = data.content[0].text.trim().replace(/「|」|。|、|\s/g, '');
  const aiHWord = toHiragana(aiWord);
  const aiLastChar = getLastChar(aiHWord);

  // Validate AI word
  if (getFirstChar(aiHWord) !== lastChar || aiLastChar === 'ん' || shiritori.usedWords.has(aiHWord)) {
    const msg = `うーん、思い浮かびません。私の負けです！またやりましょう。`;
    addMessage('assistant', msg);
    speak(msg);
    setTimeout(() => {
      shiritori = { lastChar: '', usedWords: new Set(), active: true };
      greetShiritori();
    }, 4000);
    return;
  }

  shiritori.usedWords.add(aiHWord);
  shiritori.lastChar = aiLastChar;
  updateShiritoriStatus();

  const msg = `「${aiWord}」！次は「${aiLastChar}」から始まる言葉をどうぞ。`;
  addMessage('assistant', msg);
  speak(msg);
}

function updateShiritoriStatus() {
  document.getElementById('last-char').textContent = shiritori.lastChar || '―';
  document.getElementById('used-count').textContent = shiritori.usedWords.size;
}

// ─── Speech Synthesis ─────────────────────────────────────────────────────────
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = 0.88;
  utter.volume = parseFloat(document.getElementById('volume-slider').value);
  utter.onstart = () => {
    isSpeaking = true;
    document.getElementById('stop-btn').style.display = 'block';
  };
  utter.onend = utter.onerror = () => {
    isSpeaking = false;
    document.getElementById('stop-btn').style.display = 'none';
  };
  currentUtterance = utter;
  window.speechSynthesis.speak(utter);
}

function stopSpeaking() {
  window.speechSynthesis.cancel();
  isSpeaking = false;
  document.getElementById('stop-btn').style.display = 'none';
}

// ─── UI Helpers ───────────────────────────────────────────────────────────────
function addMessage(role, text) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'message ' + (role === 'user' ? 'user' : 'assistant');

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + (role === 'user' ? 'user-av' : 'ai-av');
  avatar.textContent = role === 'user' ? '👤' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.textContent = text;

  div.appendChild(avatar);
  div.appendChild(bubble);
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function clearChat() {
  document.getElementById('chat-area').innerHTML = '';
}

function showStatus(msg, isError = false) {
  const el = document.getElementById('status-text');
  el.textContent = msg;
  el.style.color = isError ? '#c62828' : '#555';
}
</script>
</body>
</html>
